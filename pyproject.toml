[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyanoneg"
version = "0.1.0"
description = "Reproducible cyanotype digital negatives for the Epson ET-1810"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=11",
    "tifffile>=2025.1.1",
    # tifffile cannot decode the LZW-compressed calibration chart without this.
    "imagecodecs>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cyanoneg = "cyanoneg.__main__:main"

[tool.setuptools.packages.find]
include = ["cyanoneg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
